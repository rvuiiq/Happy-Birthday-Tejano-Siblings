<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Kawaii Lockscreen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="relative flex items-center justify-center min-h-screen p-4 text-pink-700">

  <!-- Background Floating Animations Container -->
  <div id="particles-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

  <!-- MAIN LOCK SCREEN CONTAINER -->
  <div id="lockscreen" class="relative z-10 w-full max-w-sm flex flex-col items-center transition-all duration-700 ease-in-out">
    
    <!-- Polaroid Photo Frame & Header -->
    <div id="photo-frame-wrapper" class="w-full bg-white p-4 rounded-3xl border-4 border-pink-300 shadow-xl flex flex-col items-center relative transform hover:scale-[1.02] transition-transform duration-300">
      
      <!-- Top Decor Ribbon / Pin -->
      <div class="absolute -top-4 bg-pink-400 text-white px-4 py-1 rounded-full text-xs font-bold shadow-md flex items-center gap-1">
        <i class="fa-solid fa-heart text-pink-200"></i> Locked Memory
      </div>

      <!-- Main Polaroid Image -->
      <div class="w-full h-52 rounded-2xl overflow-hidden border-2 border-pink-100 relative group bg-pink-50">
        <img id="polaroid-img" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=800&auto=format&fit=crop" alt="Cute Memory Illustration" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
        <div class="absolute inset-0 bg-gradient-to-t from-pink-900/30 to-transparent pointer-events-none"></div>
        <div class="absolute bottom-2 right-2 bg-white/80 backdrop-blur-sm text-pink-600 px-2 py-0.5 rounded-lg text-xs font-bold">
          ✨ 10.3.12
        </div>
      </div>

      <!-- Password Prompt Text & Indicator Dots -->
      <div class="mt-3 text-center w-full">
        <p id="prompt-text" class="text-sm font-bold text-pink-500 tracking-wide uppercase flex items-center justify-center gap-1">
          <span>Enter the passcode!</span>
          <i class="fa-solid fa-sparkles text-pink-400"></i>
        </p>
        
        <!-- Code Indicator Hearts/Dots -->
        <div id="dots-container" class="flex justify-center gap-2 mt-2">
          <div class="dot w-4 h-4 rounded-full border-2 border-pink-400 bg-pink-100 flex items-center justify-center text-[10px] text-pink-500 transition-all"></div>
          <div class="dot w-4 h-4 rounded-full border-2 border-pink-400 bg-pink-100 flex items-center justify-center text-[10px] text-pink-500 transition-all"></div>
          <div class="dot w-4 h-4 rounded-full border-2 border-pink-400 bg-pink-100 flex items-center justify-center text-[10px] text-pink-500 transition-all"></div>
          <div class="dot w-4 h-4 rounded-full border-2 border-pink-400 bg-pink-100 flex items-center justify-center text-[10px] text-pink-500 transition-all"></div>
          <div class="dot w-4 h-4 rounded-full border-2 border-pink-400 bg-pink-100 flex items-center justify-center text-[10px] text-pink-500 transition-all"></div>
        </div>
      </div>
    </div>

    <!-- Decorative Bow & Stars Divider -->
    <div class="my-4 flex items-center justify-center gap-3">
      <!-- Star Left -->
      <div class="w-10 h-10 bg-white rounded-2xl border-2 border-pink-300 flex items-center justify-center text-pink-400 shadow-sm transform -rotate-12">
        <i class="fa-solid fa-star text-lg"></i>
      </div>

      <!-- Ribbon Bow Center -->
      <div class="px-5 py-2 bg-gradient-to-r from-pink-300 via-pink-400 to-pink-300 rounded-full text-white shadow-md border-2 border-white flex items-center gap-2">
        <i class="fa-solid fa-ribbon text-xl"></i>
        <i class="fa-solid fa-heart text-xs text-pink-100 animate-pulse"></i>
        <i class="fa-solid fa-ribbon text-xl transform scale-x-[-1]"></i>
      </div>

      <!-- Star Right -->
      <div class="w-10 h-10 bg-white rounded-2xl border-2 border-pink-300 flex items-center justify-center text-pink-400 shadow-sm transform rotate-12">
        <i class="fa-solid fa-star text-lg"></i>
      </div>
    </div>

    <!-- Cute Numeric Keypad -->
    <div class="w-full grid grid-cols-3 gap-3.5 px-2">
      <button onclick="pressKey('1')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">1</button>
      <button onclick="pressKey('2')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">2</button>
      <button onclick="pressKey('3')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">3</button>
      <button onclick="pressKey('4')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">4</button>
      <button onclick="pressKey('5')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">5</button>
      <button onclick="pressKey('6')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">6</button>
      <button onclick="pressKey('7')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">7</button>
      <button onclick="pressKey('8')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">8</button>
      <button onclick="pressKey('9')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">9</button>
      
      <!-- Bottom Row with Backspace & Zero -->
      <button onclick="clearKey()" class="btn-kawaii h-14 rounded-2xl text-sm font-bold flex items-center justify-center text-pink-400 active:scale-95">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button onclick="pressKey('0')" class="btn-kawaii h-14 rounded-2xl text-xl font-extrabold flex items-center justify-center active:scale-95">0</button>
      <button onclick="backspaceKey()" class="btn-kawaii h-14 rounded-2xl text-sm font-bold flex items-center justify-center text-pink-400 active:scale-95">
        <i class="fa-solid fa-backspace"></i>
      </button>
    </div>
  </div>


  <!-- UNLOCKED MAIN CONTENT DASHBOARD -->
  <div id="main-content" class="hidden fixed inset-0 z-20 overflow-y-auto p-4 md:p-8 transition-opacity duration-700 opacity-0 bg-pink-50/90 backdrop-blur-md">
    <div class="max-w-4xl mx-auto space-y-6 pb-12 min-h-full flex flex-col justify-center">
      
      <!-- Top Navbar / Header -->
      <header class="kawaii-card p-4 md:p-6 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-pink-200 rounded-2xl flex items-center justify-center text-pink-500 text-2xl border-2 border-pink-300">
            <i class="fa-solid fa-heart text-pink-400"></i>
          </div>
          <div>
            <h1 class="text-xl md:text-2xl font-bold text-pink-600 flex items-center gap-2">
              Welcome! 💕
            </h1>
            <p class="text-xs md:text-sm text-pink-400">Choose a room to enter</p>
          </div>
        </div>

        <!-- Re-Lock Button -->
        <button onclick="lockScreen()" class="px-5 py-2.5 bg-gradient-to-r from-pink-400 to-rose-400 text-white font-bold rounded-2xl shadow-md hover:shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center gap-2 text-sm">
          <i class="fa-solid fa-lock"></i> Lock Screen
        </button>
      </header>

      <!-- VIEW 1: ROOM SELECTION BUTTONS -->
      <div id="room-selection-view" class="transition-all duration-500">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 my-auto pt-4">
          
          <!-- Robyn's Room Button -->
          <button onclick="openRoom('Robyn\'s Room', 'fa-sparkles')" class="kawaii-card p-8 group hover:border-pink-400 hover:scale-[1.03] active:scale-95 transition-all duration-300 flex flex-col items-center justify-center gap-4 text-center cursor-pointer">
            <div class="w-20 h-20 bg-pink-100 group-hover:bg-pink-200 rounded-3xl border-2 border-pink-300 flex items-center justify-center text-pink-500 text-3xl shadow-inner transition-colors">
              <i class="fa-solid fa-sparkles text-pink-400 group-hover:rotate-12 transition-transform"></i>
            </div>
            <div>
              <h2 class="text-2xl font-extrabold text-pink-600">Robyn's Room</h2>
              <p class="text-xs font-semibold text-pink-400 mt-1">Tap to enter →</p>
            </div>
          </button>

          <!-- Riley's Room Button -->
          <button onclick="openRoom('Riley\'s Room', 'fa-heart')" class="kawaii-card p-8 group hover:border-pink-400 hover:scale-[1.03] active:scale-95 transition-all duration-300 flex flex-col items-center justify-center gap-4 text-center cursor-pointer">
            <div class="w-20 h-20 bg-pink-100 group-hover:bg-pink-200 rounded-3xl border-2 border-pink-300 flex items-center justify-center text-pink-500 text-3xl shadow-inner transition-colors">
              <i class="fa-solid fa-heart text-pink-400 group-hover:scale-110 transition-transform"></i>
            </div>
            <div>
              <h2 class="text-2xl font-extrabold text-pink-600">Riley's Room</h2>
              <p class="text-xs font-semibold text-pink-400 mt-1">Tap to enter →</p>
            </div>
          </button>

        </div>
      </div>

      <!-- VIEW 2: INDIVIDUAL ROOM PAGE -->
      <div id="room-content-view" class="hidden transition-all duration-500 space-y-6">
        
        <!-- Room Navigation Bar -->
        <div class="flex items-center justify-between">
          <button onclick="backToRoomSelection()" class="px-4 py-2 bg-white/80 hover:bg-white text-purple-500 font-bold rounded-2xl border-2 border-purple-200 shadow-sm hover:scale-105 active:scale-95 transition-all text-xs flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Back to Rooms
          </button>
          
          <h2 id="room-title" class="text-xl md:text-2xl font-extrabold text-purple-600 flex items-center gap-2">
            <!-- Room Title Injected Here -->
          </h2>
        </div>

        <!-- ROBYN'S ROOM CANVAS -->
        <div id="robyn-room-canvas" class="kawaii-card p-6 md:p-8 space-y-6 bg-gradient-to-b from-white/90 to-amber-50/50 border-4 border-purple-200 shadow-xl">
          
          <!-- Top Row: Profile Frame, Info & Spinning Song Image Player -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-6 pb-6 border-b-2 border-dashed border-purple-200">
            
            <!-- Left: Profile Frame & Details -->
            <div class="flex items-center gap-5 text-left w-full sm:w-auto">
              <!-- Circular Picture Frame -->
              <div class="w-36 h-36 rounded-full overflow-hidden flex-shrink-0 relative flex items-center justify-center">
                <img id="robyn-profile-img" src="robyn.jpe" alt="Robyn Lyric" class="absolute w-[80%] h-[80%] object-cover rounded-full z-0">
                <img src="robyn border.png" alt="Robyn Border" class="absolute inset-0 w-full h-full object-cover z-10 pointer-events-none">
              </div>
              
              <!-- Name & Turning Prompt -->
              <div class="space-y-1.5">
                <h3 class="text-xl md:text-2xl font-extrabold text-purple-500">Robyn Lyric E. Tejano</h3>
                <div class="text-base font-bold text-purple-400 flex items-center gap-2 flex-wrap">
                  <span>Turning:</span>
                  <input type="text" id="turning-input" maxlength="2" placeholder="___" class="w-20 px-2 py-1 text-center font-extrabold text-purple-600 text-lg bg-purple-50 border-2 border-purple-300 rounded-xl focus:outline-none focus:border-pink-400 shadow-inner">
                </div>
              </div>
            </div>

            <!-- Right: Spinning Music Player -->
            <div class="flex flex-col items-center">
              <div class="w-36 h-36 rounded-full overflow-hidden bg-white flex items-center justify-center relative animate-spin-slow cursor-pointer" onclick="toggleRoomMusic()" title="Click to play/pause music">
                <img src="robyn's song.png" alt="Robyn's Song" class="w-full h-full rounded-full object-cover">
              </div>
              <span class="text-xs font-bold text-purple-400 mt-1.5 flex items-center gap-1">
                <i class="fa-solid fa-music text-pink-400 animate-pulse"></i> Playing Audio
              </span>
            </div>

          </div>

          <!-- Audio Element -->
          <audio id="robyn-audio" loop>
            <source src="The Long Faces - Jane! (Lyrics).mp3" type="audio/mpeg">
          </audio>

          <!-- LOCKED REST OF CONTENT (Revealed when input equals "14") -->
          <div id="unlocked-room-content" class="hidden space-y-6 transition-all duration-700 opacity-0">
            
            <!-- Gallery Button -->
            <button onclick="openGalleryFolders()" class="w-full py-4 px-6 bg-gradient-to-r from-pink-200 via-yellow-100 to-orange-100 hover:from-pink-300 hover:to-orange-200 text-purple-600 font-extrabold rounded-2xl border-3 border-pink-300 shadow-md hover:scale-[1.01] active:scale-95 transition-all flex items-center justify-center gap-2 text-base cursor-pointer">
              <i class="fa-solid fa-images text-pink-500"></i> Gallery
            </button>

            <!-- Messaging List Underneath Gallery -->
            <div class="space-y-3">
              <h4 class="text-sm font-extrabold text-purple-600 px-1 flex items-center gap-1.5">
                <i class="fa-solid fa-comments text-pink-400"></i> Messages
              </h4>
              <div id="greeters-list" class="space-y-2 max-h-[420px] overflow-y-auto pr-1">
                <!-- Injected dynamically via JS -->
              </div>
            </div>

          </div>

          <!-- GALLERY FOLDERS SUB-VIEW -->
          <div id="gallery-folders-view" class="hidden space-y-4 transition-all duration-500">
            <div class="flex items-center justify-between pb-2 border-b border-purple-200">
              <button onclick="backToRobynRoomFromGallery()" class="px-4 py-2 bg-white hover:bg-purple-50 text-purple-500 font-bold rounded-2xl border-2 border-purple-200 shadow-sm text-xs flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i> Back to Room
              </button>
              <h4 class="text-lg font-extrabold text-purple-600"><i class="fa-solid fa-folder-open text-pink-400"></i> Gallery Folders</h4>
            </div>

            <!-- Folders Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 p-6 min-h-[300px] items-center justify-items-center bg-white/80 rounded-2xl border-2 border-purple-200">
              
              <!-- Folder 1: BJ Main Dancers -->
              <div onclick="openFolderViewer('BJ Main Dancers')" class="flex flex-col items-center gap-2 cursor-pointer group">
                <div class="w-24 h-20 relative flex items-center justify-center group-hover:scale-105 transition-transform">
                  <img src="folder.jpg" alt="Folder" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                  <!-- Fallback if folder.jpg is missing -->
                  <div style="display:none;" class="w-24 h-20 bg-amber-400 rounded-lg relative shadow-md border-2 border-amber-500 items-center justify-center">
                    <div class="absolute -top-3 left-2 w-10 h-4 bg-amber-400 rounded-t-md border-t-2 border-x-2 border-amber-500"></div>
                  </div>
                </div>
                <span class="text-xs font-extrabold text-purple-700 text-center">BJ Main Dancers</span>
              </div>

              <!-- Folder 2: School -->
              <div onclick="openFolderViewer('School')" class="flex flex-col items-center gap-2 cursor-pointer group">
                <div class="w-24 h-20 relative flex items-center justify-center group-hover:scale-105 transition-transform">
                  <img src="folder.jpg" alt="Folder" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                  <!-- Fallback if folder.jpg is missing -->
                  <div style="display:none;" class="w-24 h-20 bg-amber-400 rounded-lg relative shadow-md border-2 border-amber-500 items-center justify-center">
                    <div class="absolute -top-3 left-2 w-10 h-4 bg-amber-400 rounded-t-md border-t-2 border-x-2 border-amber-500"></div>
                  </div>
                </div>
                <span class="text-xs font-extrabold text-purple-700 text-center">School</span>
              </div>

              <!-- Folder 3: Outer world -->
              <div onclick="openFolderViewer('Outer world')" class="flex flex-col items-center gap-2 cursor-pointer group">
                <div class="w-24 h-20 relative flex items-center justify-center group-hover:scale-105 transition-transform">
                  <img src="folder.jpg" alt="Folder" class="w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                  <!-- Fallback if folder.jpg is missing -->
                  <div style="display:none;" class="w-24 h-20 bg-amber-400 rounded-lg relative shadow-md border-2 border-amber-500 items-center justify-center">
                    <div class="absolute -top-3 left-2 w-10 h-4 bg-amber-400 rounded-t-md border-t-2 border-x-2 border-amber-500"></div>
                  </div>
                </div>
                <span class="text-xs font-extrabold text-purple-700 text-center">Outer world</span>
              </div>

            </div>
          </div>

          <!-- CHAT ROOM SUB-VIEW -->
          <div id="chat-room-view" class="hidden space-y-4 transition-all duration-500">
            <div class="flex items-center justify-between pb-2 border-b border-purple-200">
              <button onclick="backToGalleryList()" class="px-4 py-2 bg-white hover:bg-purple-50 text-purple-500 font-bold rounded-2xl border-2 border-purple-200 shadow-sm text-xs flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i> Back to Messages
              </button>
              <h4 id="chat-greeter-title" class="text-lg font-extrabold text-purple-600">Chat</h4>
            </div>

            <!-- Chat Canvas Area -->
            <div class="p-6 min-h-[380px] flex flex-col justify-between border-2 border-purple-200 bg-white/90 rounded-2xl shadow-inner space-y-6">
              
              <!-- Messages Scroll Area -->
              <div class="space-y-4">
                <!-- Friend's Message Bubble -->
                <div class="flex items-start gap-3">
                  <div id="chat-avatar" class="w-10 h-10 rounded-full bg-purple-200 border-2 border-purple-300 overflow-hidden flex items-center justify-center text-purple-700 font-bold text-xs flex-shrink-0">
                    <!-- Avatar -->
                  </div>
                  <div class="relative bg-orange-100 border-2 border-orange-200 p-4 rounded-2xl rounded-tl-none shadow-sm text-purple-900 text-sm font-medium leading-relaxed max-w-[85%] whitespace-pre-line" id="chat-message-text">
                    <!-- Message -->
                  </div>
                </div>

                <!-- User's Chosen Response Bubble (Appears when selected) -->
                <div id="user-response-container" class="hidden flex flex-col items-end space-y-1">
                  <div class="relative bg-pink-200 border-2 border-pink-300 p-4 rounded-2xl rounded-tr-none shadow-sm text-purple-900 text-sm font-medium leading-relaxed max-w-[85%] text-right" id="user-response-text">
                    <!-- Chosen Response -->
                  </div>
                  <!-- Seen label appears after 1 second -->
                  <span id="seen-label" class="text-[11px] font-bold text-purple-400 opacity-0 transition-opacity duration-500 pr-1">Seen</span>
                </div>
              </div>

              <!-- Response Options Area -->
              <div id="response-options-area" class="space-y-2 pt-4 border-t-2 border-dashed border-purple-200">
                <p class="text-xs font-bold text-purple-400">Response:</p>
                <div class="grid grid-cols-1 gap-2">
                  <button onclick="selectResponse('Awh thank you!')" class="w-full py-3 px-4 bg-purple-200 hover:bg-purple-300 text-purple-700 font-extrabold rounded-2xl border-2 border-purple-300 shadow-sm text-sm transition-all text-center cursor-pointer">
                    Awh thank you!
                  </button>
                  <button onclick="selectResponse('Aura or laura')" class="w-full py-3 px-4 bg-purple-200 hover:bg-purple-300 text-purple-700 font-extrabold rounded-2xl border-2 border-purple-300 shadow-sm text-sm transition-all text-center cursor-pointer">
                    Aura or laura
                  </button>
                </div>
              </div>

            </div>
          </div>

        </div>

        <!-- DEFAULT EMPTY CANVAS FOR RILEY'S ROOM & OTHER ROOMS -->
        <div id="default-room-canvas" class="hidden kawaii-card p-12 min-h-[420px] flex flex-col items-center justify-center text-center border-dashed border-4 border-pink-200 bg-white/60">
          <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center text-pink-300 text-2xl mb-3">
            <i id="room-icon" class="fa-solid fa-box-open"></i>
          </div>
          <p class="text-sm font-bold text-pink-300">This room is currently empty.</p>
        </div>

      </div>

    </div>
  </div>


  <!-- RETRO WINDOW POPUP FOR FOLDER IMAGE VIEWER -->
  <div id="folder-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs p-4">
    <div class="w-full max-w-lg bg-gray-200 border-2 border-t-white border-l-white border-b-gray-600 border-r-gray-600 shadow-2xl rounded-sm overflow-hidden flex flex-col">
      
      <!-- Retro Window Title Bar -->
      <div class="bg-gradient-to-r from-blue-900 to-blue-700 px-3 py-1.5 flex items-center justify-between text-white select-none">
        <div class="flex items-center gap-2 text-xs font-bold">
          <i class="fa-solid fa-folder-open text-amber-300"></i>
          <span id="modal-folder-title">Folder Viewer</span>
        </div>
        <div class="flex items-center gap-1">
          <button class="w-5 h-5 bg-gray-300 text-black border border-white flex items-center justify-center text-[10px] font-bold active:bg-gray-400">_</button>
          <button class="w-5 h-5 bg-gray-300 text-black border border-white flex items-center justify-center text-[10px] font-bold active:bg-gray-400">□</button>
          <button onclick="closeFolderModal()" class="w-5 h-5 bg-gray-300 text-black border border-white flex items-center justify-center text-[10px] font-bold hover:bg-rose-500 hover:text-white cursor-pointer">✕</button>
        </div>
      </div>

      <!-- Retro Window Content Area -->
      <div class="p-4 bg-white border-2 border-t-gray-600 border-l-gray-600 border-b-white border-r-white m-2 flex flex-col items-center space-y-4">
        
        <!-- Image Container & Fullscreen wrapper -->
        <div id="image-frame-container" class="w-full h-72 bg-gray-100 border-2 border-gray-400 rounded flex items-center justify-center relative overflow-hidden group">
          <img id="modal-current-image" src="" alt="Folder Image" class="max-h-full max-w-full object-contain">
          
          <!-- Fullscreen button overlay -->
          <button onclick="toggleImageFullscreen()" class="absolute top-2 right-2 bg-black/60 hover:bg-black text-white p-2 rounded text-xs opacity-80 hover:opacity-100 transition-opacity cursor-pointer" title="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>

        <!-- Image Counter & Controls -->
        <div class="w-full flex items-center justify-between">
          <button onclick="prevFolderImage()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-black font-bold text-xs border-2 border-t-white border-l-white border-b-gray-600 border-r-gray-600 active:border-inset cursor-pointer flex items-center gap-1">
            <i class="fa-solid fa-arrow-left"></i> Previous
          </button>
          
          <span id="modal-image-counter" class="text-xs font-bold text-gray-600">1 / 3</span>
